kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: soka-datacenter
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30081
        hostPort: 30081
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30082
        hostPort: 30082
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30083
        hostPort: 30083
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30084
        hostPort: 30084
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      soka.its.ac.id/datacenter: "datacenter-1"
      soka.its.ac.id/host-id: "host-1"
      soka.its.ac.id/host-name: "soka-host-1"
  - role: worker
    labels:
      soka.its.ac.id/datacenter: "datacenter-1"
      soka.its.ac.id/host-id: "host-2"
      soka.its.ac.id/host-name: "soka-host-2"
