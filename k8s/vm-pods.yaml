apiVersion: v1
kind: Namespace
metadata:
  name: soka-cloud
---
apiVersion: v1
kind: Pod
metadata:
  name: vm-1-small
  namespace: soka-cloud
  labels: {app: soka-vm, vm-id: "1", host-id: host-1}
spec:
  automountServiceAccountToken: false
  nodeSelector: {soka.its.ac.id/host-id: host-1}
  restartPolicy: Always
  terminationGracePeriodSeconds: 10
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: vm-worker
      image: soka-vm-worker:phase3
      imagePullPolicy: Never
      ports: [{name: http, containerPort: 8000}]
      env:
        - {name: VM_ID, value: "1"}
        - {name: VM_NAME, value: VM1_Small}
        - {name: HOST_ID, value: host-1}
        - {name: MIPS, value: "50.0"}
        - {name: BW_MBPS, value: "100.0"}
        - {name: COST_PER_MI, value: "0.03"}
        - {name: CPU_LIMIT_MILLICORES, value: "250"}
        - {name: CPU_WORKERS, value: "2"}
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {cpu: 250m, memory: 256Mi}
      readinessProbe:
        httpGet: {path: /health, port: http}
        initialDelaySeconds: 2
        periodSeconds: 2
      livenessProbe:
        httpGet: {path: /health, port: http}
        initialDelaySeconds: 10
        periodSeconds: 10
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts: [{name: tmp, mountPath: /tmp}]
  volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: vm-1-service, namespace: soka-cloud}
spec:
  type: NodePort
  selector: {vm-id: "1"}
  ports: [{name: http, port: 8000, targetPort: http, nodePort: 30081}]
---
