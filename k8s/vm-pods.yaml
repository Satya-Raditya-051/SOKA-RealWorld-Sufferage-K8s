apiVersion: v1
kind: Namespace
metadata:
  name: soka-cloud
---
apiVersion: v1
kind: Pod
metadata:
  name: vm-1-small
  namespace: soka-cloud
  labels:
    app: soka-vm
    vm-id: "1"
    host-id: "host-1"
spec:
  nodeSelector:
    soka.its.ac.id/host-id: "host-1"
  containers:
    - name: vm-worker
      image: soka-vm-worker:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
      env:
        - {name: VM_ID, value: "1"}
        - {name: VM_NAME, value: "VM1_Small"}
        - {name: HOST_ID, value: "host-1"}
        - {name: MIPS, value: "50.0"}
        - {name: BW_MBPS, value: "100.0"}
        - {name: COST_PER_MI, value: "0.03"}
        - {name: CPU_LIMIT_MILLICORES, value: "250"}
      resources:
        requests: {cpu: "250m", memory: "128Mi"}
        limits: {cpu: "250m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: vm-1-service
  namespace: soka-cloud
spec:
  type: NodePort
  selector: {vm-id: "1"}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30081}]
---
